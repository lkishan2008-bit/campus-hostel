{% extends "base.html" %}

{% block title %}Edit Weekly Menu | Campus Hostel Companion{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Edit weekly menu</h1>
  <p>Update the 7-day mess schedule. All fields are required.</p>
</div>

<form method="POST" action="{{ url_for('edit_menu') }}" novalidate id="form-edit-menu">
  {% for day in days %}
  <div class="card" style="margin-bottom: 1.25rem;">
    <div class="card-header-row">
      <div class="card__title">{{ day }}</div>
    </div>

    <div class="edit-menu-row">
      <div class="form-group edit-menu-field">
        <label for="{{ day }}-breakfast">Breakfast</label>
        <input
          type="text"
          id="{{ day }}-breakfast"
          name="{{ day }}_breakfast"
          class="form-input"
          placeholder="e.g. Idli, Sambar, Tea"
          value="{{ weekly[day].breakfast or '' }}"
          required
        />
      </div>

      <div class="form-group edit-menu-field">
        <label for="{{ day }}-lunch">Lunch</label>
        <input
          type="text"
          id="{{ day }}-lunch"
          name="{{ day }}_lunch"
          class="form-input"
          placeholder="e.g. Rice, Dal, Roti, Sabzi"
          value="{{ weekly[day].lunch or '' }}"
          required
        />
      </div>

      <div class="form-group edit-menu-field">
        <label for="{{ day }}-dinner">Dinner</label>
        <input
          type="text"
          id="{{ day }}-dinner"
          name="{{ day }}_dinner"
          class="form-input"
          placeholder="e.g. Paneer Curry, Jeera Rice"
          value="{{ weekly[day].dinner or '' }}"
          required
        />
      </div>
    </div>
  </div>
  {% endfor %}

  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem;">
    <button type="submit" class="btn-black" id="btn-save-menu">Save weekly menu</button>
    <a href="{{ url_for('weekly_menu') }}" class="btn-outline">Cancel</a>
  </div>
</form>
{% endblock %}
