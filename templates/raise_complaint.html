{% extends "base.html" %}

{% block title %}Raise a complaint | Campus Hostel Companion{% endblock %}

{% block content %}
<a href="{{ url_for('dashboard') }}" class="back-link">&larr; Back to dashboard</a>

<div class="page-header" style="margin-bottom: 1.5rem;">
  <h1>Raise a complaint</h1>
  <p>Describe the issue and it stays on record until it's resolved.</p>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('raise_complaint') }}">
    <!-- Title -->
    <div class="form-group">
      <label for="title">Title</label>
      <input
        type="text"
        id="title"
        name="title"
        class="form-input"
        placeholder="Ceiling fan in room 204 isn't working"
        maxlength="120"
        required
        autofocus
      />
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category" class="form-select" required>
        <option value="" disabled selected>Select a category</option>
        <option value="Electrical">Electrical</option>
        <option value="Plumbing">Plumbing</option>
        <option value="Cleaning">Cleaning</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Description with character counter -->
    <div class="form-group">
      <div class="form-group-header">
        <label for="description">Description</label>
        <span class="char-counter" id="descCounter">0/2000</span>
      </div>
      <textarea
        id="description"
        name="description"
        class="form-textarea"
        placeholder="What's wrong, where, and since when? The more detail, the faster it gets fixed."
        maxlength="2000"
        required
        oninput="document.getElementById('descCounter').textContent = this.value.length + '/2000'"
      ></textarea>
    </div>

    <!-- Two buttons bottom right: Cancel (plain text/outline) and Submit complaint (black, filled) -->
    <div class="form-actions">
      <a href="{{ url_for('dashboard') }}" class="btn-link">Cancel</a>
      <button type="submit" class="btn-black">
        <span>Submit complaint</span>
      </button>
    </div>
  </form>
</div>
{% endblock %}
