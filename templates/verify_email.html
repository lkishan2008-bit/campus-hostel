{% extends "base.html" %}

{% block title %}Verify Email | Campus Hostel Companion{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h1>Verify your email</h1>
    <p class="auth-subtext">
      Enter the 6-digit verification code sent to your email.
    </p>

    <form method="POST" action="{{ url_for('verify_email') }}" id="form-verify-email" novalidate>
      <input type="hidden" name="action" id="form-action" value="verify" />

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="verify-email">College email</label>
        <input
          type="email"
          id="verify-email"
          name="email"
          class="form-input"
          placeholder="name@college.edu"
          value="{{ email or '' }}"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="verify-code">Verification code</label>
        <input
          type="text"
          id="verify-code"
          name="code"
          class="form-input"
          placeholder="e.g. 123456"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="8"
          required
          autofocus
        />
      </div>

      <button type="submit" class="btn-black" style="width: 100%;" id="btn-verify-email">
        <span>Verify email &rarr;</span>
      </button>

      <div class="or-divider">OR</div>

      <button
        type="button"
        class="btn-outline"
        style="width: 100%;"
        id="btn-resend-code"
        onclick="document.getElementById('form-action').value='resend'; document.getElementById('form-verify-email').submit();"
      >
        Resend code
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="{{ url_for('login') }}" class="auth-note" style="color: var(--text-main); font-weight: 500; text-decoration: none;">
        &larr; Back to Sign in
      </a>
    </div>
  </div>
</div>
{% endblock %}
